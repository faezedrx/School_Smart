<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="School Smart — Interactive school management demo built with vanilla JavaScript, LocalStorage and Cookie session.">
<title>School Smart — Interactive Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{--ui-font:"Vazirmatn",Tahoma,Arial,sans-serif}
.login-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top right,#dbeafe,transparent 35%),var(--ui-bg)}
.login-card{width:min(440px,100%);background:#fff;border:1px solid var(--ui-border);border-radius:28px;padding:34px;box-shadow:0 24px 70px rgba(15,23,42,.12)}
.brand-large{display:flex;gap:12px;align-items:center;margin-bottom:26px}.brand-large strong{display:block;font-size:22px}.brand-large span{display:block;color:var(--ui-muted);font-size:12px}.brand-mark{width:52px;height:52px;border-radius:16px;background:#2563eb;color:#fff;display:grid;place-items:center;font-size:25px}.login-card h1{margin:0 0 5px;font-size:26px}.muted{color:var(--ui-muted);font-size:13px}.demo-note{margin-top:18px;padding:14px 16px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:14px;display:grid;gap:3px;font-size:12px;color:#1e40af}.demo-note strong{font-size:13px}.role-chip{margin:0 10px 14px;padding:8px 10px;background:#eff6ff;color:#1d4ed8;border-radius:10px;font-size:11px;font-weight:800;text-align:center}.sidebar-bottom{display:grid;gap:8px;margin-top:24px;padding:10px}.topbar-left{display:flex;align-items:center;gap:10px}.ui-user small{color:var(--ui-muted);font-size:11px}.section-gap{margin-top:16px}.card-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.card-title h3{margin:0;font-size:16px}.link{color:#2563eb;font-weight:800;font-size:12px}.stat-hint{font-size:11px;color:#16a34a;margin-top:5px}.bars{display:grid;gap:16px}.bar-row{display:grid;grid-template-columns:100px 1fr 30px;align-items:center;gap:10px;font-size:12px}.bar{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:#2563eb;border-radius:999px}.activity-list{display:grid}.activity{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eef2f7}.activity:last-child{border-bottom:0}.activity-dot{width:8px;height:8px;background:#2563eb;border-radius:50%;margin-top:8px;flex:0 0 auto}.activity b,.activity small{display:block}.activity b{font-size:12px}.activity small{font-size:10px;color:var(--ui-muted)}.announcement-row{display:flex;justify-content:space-between;gap:15px;padding:14px 0;border-bottom:1px solid #eef2f7}.announcement-row:last-child{border-bottom:0}.announcement-row p{margin:3px 0 0;color:var(--ui-muted);font-size:12px}.announcement-row span{font-size:10px;color:var(--ui-muted);white-space:nowrap}.toolbar{display:flex;gap:10px;margin-bottom:14px}.toolbar input,.toolbar select{border:1px solid var(--ui-border);border-radius:10px;padding:10px 12px;background:#fff;outline:none}.toolbar input{flex:1}.teacher-card{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}.teacher-avatar{width:48px;height:48px;border-radius:14px;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;font-weight:900;font-size:20px}.teacher-card h3{margin:0;font-size:15px}.teacher-card p{margin:2px 0;color:var(--ui-muted);font-size:11px}.full-actions{grid-column:1/-1}.capacity{margin-top:18px}.capacity span{font-size:11px;color:var(--ui-muted)}.capacity .bar{margin-top:7px}.mini-list>div,.notice{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #eef2f7}.mini-list>div:last-child,.notice:last-child{border-bottom:0}.mini-list strong{font-size:17px}.notice b{font-size:12px}.notice span{font-size:10px;color:var(--ui-muted)}.score.good{color:#16a34a}.score.bad{color:#dc2626}.attendance-board{margin-bottom:16px}.attendance-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #eef2f7}.attendance-row:last-child{border-bottom:0}.attendance-row small{display:block;color:var(--ui-muted);font-size:10px}.attendance-buttons{display:flex;gap:6px}.attendance-btn{border:1px solid #e5e7eb;background:#fff;border-radius:9px;padding:7px 10px;font-size:11px}.attendance-btn.selected{border-color:#2563eb;background:#eff6ff;color:#1d4ed8;font-weight:800}.assignment-card{position:relative}.assignment-top{display:flex;justify-content:space-between}.assignment-card h3{margin:14px 0 5px;font-size:16px}.assignment-card p{margin:0;color:var(--ui-muted);font-size:12px}.assignment-meta{display:flex;justify-content:space-between;margin:18px 0;color:var(--ui-muted);font-size:10px}.announcement-card{display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:start;padding:16px 0;border-bottom:1px solid #eef2f7}.announcement-card:last-child{border-bottom:0}.announcement-card h3{margin:0;font-size:15px}.announcement-card p{margin:4px 0;color:var(--ui-muted);font-size:12px}.announcement-card small{font-size:10px;color:var(--ui-muted)}.notice-icon{width:40px;height:40px;border-radius:12px;background:#eff6ff;display:grid;place-items:center}.demo-status{padding:10px 0;border-bottom:1px solid #eef2f7;color:#166534;font-size:12px}.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.48);display:grid;place-items:center;padding:20px;z-index:100}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;box-shadow:0 30px 90px rgba(0,0,0,.2)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--ui-border)}.modal-head h3{margin:0;font-size:17px}.modal-body{padding:20px}.icon-btn{border:0;background:#f3f4f6;width:34px;height:34px;border-radius:10px;font-size:22px}.toast{position:fixed;left:22px;bottom:22px;background:#0f172a;color:#fff;padding:12px 16px;border-radius:12px;z-index:200;opacity:0;transform:translateY(10px);transition:.2s;font-size:12px;box-shadow:0 12px 30px rgba(0,0,0,.18)}.toast.show{opacity:1;transform:none}.toast.error{background:#991b1b}.ui-actions{display:flex;gap:6px;flex-wrap:wrap}
@media(max-width:700px){.toolbar{flex-direction:column}.attendance-row{align-items:flex-start;flex-direction:column}.teacher-card{grid-template-columns:auto 1fr}.teacher-status{grid-column:2}.announcement-card{grid-template-columns:auto 1fr}.announcement-card>.ui-btn{grid-column:2;justify-self:start}}
</style>
